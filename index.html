<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f3a" />
    <meta
      name="description"
      content="Reusable Occu-Med terrain basemap rendered with MapLibre and open map data."
    />
    <title>Occu-Med Map</title>
  </head>
  <body>
    <main id="app">
      <div id="map" aria-label="Occu-Med reusable basemap"></div>

      <header class="map-header" aria-live="polite">
        <div>
          <span class="eyebrow">OCCU-MED</span>
          <h1>Terrain Basemap</h1>
          <p>Reusable visual foundation · no application overlays</p>
        </div>
        <span id="map-status" class="status">Preparing map…</span>
      </header>

      <section id="map-error" class="error-panel" hidden>
        <strong>Map could not be displayed.</strong>
        <span id="map-error-message"></span>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
