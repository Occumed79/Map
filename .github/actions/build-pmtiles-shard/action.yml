name: Build and publish Occu-Med PMTiles shard
description: Builds one Geofabrik leaf or bounded subdivision with the Occu-Med Planetiler schema and publishes it to a GitHub Release.

inputs:
  id:
    required: true
    description: Worldwide manifest region id
  slug:
    required: true
    description: Filesystem-safe region slug
  name:
    required: true
    description: Human-readable region name
  continent:
    required: true
    description: Root Geofabrik region
  pbf-url:
    required: true
    description: Source OSM PBF URL
  extract-bbox:
    required: false
    default: ''
    description: Optional west,south,east,north bbox extracted from the source PBF before Planetiler runs
  west:
    required: true
  south:
    required: true
  east:
    required: true
  north:
    required: true
  asset-name:
    required: true
  metadata-name:
    required: true
  release-tag:
    required: true

runs:
  using: composite
  steps:
    - name: Reuse an already-published healthy archive
      id: existing
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "${{ inputs.release-tag }}" \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          --jq '.assets[].name' | grep -Fxq '${{ inputs.asset-name }}'; then
          echo 'exists=true' >> "$GITHUB_OUTPUT"
          echo "Reusing published archive: ${{ inputs.asset-name }}"
        else
          echo 'exists=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Reclaim runner disk
      if: steps.existing.outputs.exists != 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
        docker system prune --all --force || true
        df -h

    - name: Download and prepare OpenStreetMap shard
      if: steps.existing.outputs.exists != 'true'
      shell: bash
      env:
        EXTRACT_BBOX: ${{ inputs.extract-bbox }}
      run: |
        mkdir -p .planetiler-data/tmp artifacts
        target=".planetiler-data/${{ inputs.slug }}.osm.pbf"
        if [ -n "$EXTRACT_BBOX" ]; then
          source=".planetiler-data/${{ inputs.slug }}-source.osm.pbf"
          curl --fail --location --retry 5 --retry-delay 10 \
            --output "$source" \
            "${{ inputs.pbf-url }}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium extract \
            --bbox="$EXTRACT_BBOX" \
            --strategy=complete_ways \
            --overwrite \
            --output="$target" \
            "$source"
          rm -f "$source"
        else
          curl --fail --location --retry 5 --retry-delay 10 \
            --output "$target" \
            "${{ inputs.pbf-url }}"
        fi
        test -s "$target"
        ls -lh "$target"

    - name: Build Occu-Med PMTiles shard
      if: steps.existing.outputs.exists != 'true'
      shell: bash
      env:
        OCCUMED_TILE_AREA: ${{ inputs.slug }}
        OCCUMED_OSM_PBF: ${{ github.workspace }}/.planetiler-data/${{ inputs.slug }}.osm.pbf
        OCCUMED_PMTILES_OUTPUT: ${{ github.workspace }}/artifacts/${{ inputs.asset-name }}
        OCCUMED_PLANETILER_DATA_DIR: ${{ github.workspace }}/.planetiler-data
        OCCUMED_PLANETILER_MEMORY: 5g
      run: |
        bash planetiler/build-region.sh
        rm -f ".planetiler-data/${{ inputs.slug }}.osm.pbf"
        size="$(stat --printf='%s' "artifacts/${{ inputs.asset-name }}")"
        echo "archive_size_bytes=$size"
        if [ "$size" -gt 2000000000 ]; then
          echo "Archive exceeds GitHub Release's safe per-file ceiling and must be subdivided: ${{ inputs.id }}" >&2
          exit 1
        fi

    - name: Write local shard metadata
      if: steps.existing.outputs.exists != 'true'
      shell: bash
      env:
        REGION_ID: ${{ inputs.id }}
        REGION_SLUG: ${{ inputs.slug }}
        REGION_NAME: ${{ inputs.name }}
        REGION_CONTINENT: ${{ inputs.continent }}
        PBF_URL: ${{ inputs.pbf-url }}
        EXTRACT_BBOX: ${{ inputs.extract-bbox }}
        WEST: ${{ inputs.west }}
        SOUTH: ${{ inputs.south }}
        EAST: ${{ inputs.east }}
        NORTH: ${{ inputs.north }}
        ASSET_NAME: ${{ inputs.asset-name }}
        METADATA_NAME: ${{ inputs.metadata-name }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const path = require('node:path');
        const metadata = {
          id: process.env.REGION_ID,
          slug: process.env.REGION_SLUG,
          name: process.env.REGION_NAME,
          continent: process.env.REGION_CONTINENT,
          source: process.env.PBF_URL,
          extractBbox: process.env.EXTRACT_BBOX || null,
          bounds: [
            Number(process.env.WEST),
            Number(process.env.SOUTH),
            Number(process.env.EAST),
            Number(process.env.NORTH)
          ],
          asset: process.env.ASSET_NAME,
          profile: 'planetiler/occumed-basemap.yml',
          commit: process.env.GITHUB_SHA,
          builtAt: new Date().toISOString(),
          sizeBytes: fs.statSync(path.join('artifacts', process.env.ASSET_NAME)).size
        };
        fs.writeFileSync(
          path.join('artifacts', process.env.METADATA_NAME),
          `${JSON.stringify(metadata, null, 2)}\n`
        );
        NODE

    - name: Publish PMTiles archive to GitHub Release
      if: steps.existing.outputs.exists != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ inputs.release-tag }}" \
          "artifacts/${{ inputs.asset-name }}" \
          --repo "$GITHUB_REPOSITORY" \
          --clobber

    - name: Verify published PMTiles byte ranges
      shell: bash
      run: |
        mkdir -p artifacts
        url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.release-tag }}/${{ inputs.asset-name }}"
        curl --silent --show-error --fail --location \
          --header 'Range: bytes=0-126' \
          --dump-header artifacts/release-range.headers.txt \
          --output artifacts/release-range.bin \
          "$url"
        grep -Eiq '^HTTP/.* 206' artifacts/release-range.headers.txt
        test "$(wc -c < artifacts/release-range.bin)" -eq 127
        test "$(head -c 7 artifacts/release-range.bin)" = 'PMTiles'
