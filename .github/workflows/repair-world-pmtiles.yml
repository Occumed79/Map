name: Repair Worldwide Occu-Med PMTiles

on:
  workflow_dispatch:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - planetiler/world-repair-max.trigger

permissions:
  contents: write

concurrency:
  group: occumed-world-pmtiles-repair
  cancel-in-progress: true

env:
  WORLD_RELEASE_TAG: occumed-world-v1
  WORLD_BUCKETS: 6
  OCCUMED_DIRECT_PBF_LIMIT_BYTES: 400000000
  OCCUMED_TARGET_SPLIT_PBF_BYTES: 250000000
  OCCUMED_MAX_SPLIT_CELLS: 24

jobs:
  plan-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      bucket0: ${{ steps.plan.outputs.bucket0 }}
      bucket1: ${{ steps.plan.outputs.bucket1 }}
      bucket2: ${{ steps.plan.outputs.bucket2 }}
      bucket3: ${{ steps.plan.outputs.bucket3 }}
      bucket4: ${{ steps.plan.outputs.bucket4 }}
      bucket5: ${{ steps.plan.outputs.bucket5 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate canonical size-aware world plan
        id: plan
        run: |
          mkdir -p world-plan
          node scripts/plan-world-shards.mjs --scope all > world-plan/raw-world-plan.json

          node <<'NODE'
          const fs = require('node:fs');

          const input = JSON.parse(fs.readFileSync('world-plan/raw-world-plan.json', 'utf8'));
          const excludedSourceRegions = new Set([
            'alps',
            'britain-and-ireland',
            'dach',
            'great-britain',
            'sea',
            'south-africa-and-lesotho',
            'us',
            'us-midwest',
            'us-northeast',
            'us-pacific',
            'us-south',
            'us-west'
          ]);

          const include = input.include.filter((region) =>
            !excludedSourceRegions.has(region.id) &&
            !excludedSourceRegions.has(region.source_region_id)
          );

          const ids = include.map((region) => region.id);
          const assets = include.map((region) => region.asset_name);
          if (!include.length) throw new Error('Canonical worldwide plan is empty.');
          if (new Set(ids).size !== ids.length) throw new Error('Canonical plan contains duplicate IDs.');
          if (new Set(assets).size !== assets.length) throw new Error('Canonical plan contains duplicate asset names.');
          if (include.some((region) => region.source_size_bytes > 400000000 && !region.extract_bbox)) {
            throw new Error('An oversized source remains unsplit.');
          }

          const plan = {
            ...input,
            generatedAt: new Date().toISOString(),
            canonical: true,
            excludedSourceRegions: [...excludedSourceRegions],
            include
          };
          fs.writeFileSync('world-plan/world-plan.json', `${JSON.stringify(plan, null, 2)}\n`);
          console.log(`Canonical worldwide plan contains ${include.length} PMTiles shards.`);
          NODE

          for bucket in 0 1 2 3 4 5; do
            jq \
              --argjson bucket "$bucket" \
              --argjson buckets "$WORLD_BUCKETS" \
              '{include: [.include | to_entries[] | select((.key % $buckets) == $bucket) | .value]}' \
              world-plan/world-plan.json \
              > "world-plan/bucket-${bucket}.json"
            compact="$(jq -c . "world-plan/bucket-${bucket}.json")"
            echo "bucket${bucket}=${compact}" >> "$GITHUB_OUTPUT"
          done

      - name: Create or reuse worldwide release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$WORLD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$WORLD_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Occu-Med Worldwide PMTiles v1" \
              --notes "Worldwide Occu-Med Planetiler archives built from Geofabrik OpenStreetMap extracts."

          gh release upload "$WORLD_RELEASE_TAG" \
            world-plan/world-plan.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Preserve canonical world plan
        uses: actions/upload-artifact@v4
        with:
          name: occumed-canonical-world-plan-${{ github.sha }}
          path: world-plan/world-plan.json
          if-no-files-found: error
          retention-days: 30

  build-bucket-0:
    needs: plan-world
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-world.outputs.bucket0) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-pmtiles-shard
        with:
          id: ${{ matrix.id }}
          slug: ${{ matrix.slug }}
          name: ${{ matrix.name }}
          continent: ${{ matrix.continent }}
          pbf-url: ${{ matrix.pbf_url }}
          extract-bbox: ${{ matrix.extract_bbox }}
          west: ${{ matrix.west }}
          south: ${{ matrix.south }}
          east: ${{ matrix.east }}
          north: ${{ matrix.north }}
          asset-name: ${{ matrix.asset_name }}
          metadata-name: ${{ matrix.metadata_name }}
          release-tag: ${{ env.WORLD_RELEASE_TAG }}

  build-bucket-1:
    needs: plan-world
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-world.outputs.bucket1) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-pmtiles-shard
        with:
          id: ${{ matrix.id }}
          slug: ${{ matrix.slug }}
          name: ${{ matrix.name }}
          continent: ${{ matrix.continent }}
          pbf-url: ${{ matrix.pbf_url }}
          extract-bbox: ${{ matrix.extract_bbox }}
          west: ${{ matrix.west }}
          south: ${{ matrix.south }}
          east: ${{ matrix.east }}
          north: ${{ matrix.north }}
          asset-name: ${{ matrix.asset_name }}
          metadata-name: ${{ matrix.metadata_name }}
          release-tag: ${{ env.WORLD_RELEASE_TAG }}

  build-bucket-2:
    needs: plan-world
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-world.outputs.bucket2) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-pmtiles-shard
        with:
          id: ${{ matrix.id }}
          slug: ${{ matrix.slug }}
          name: ${{ matrix.name }}
          continent: ${{ matrix.continent }}
          pbf-url: ${{ matrix.pbf_url }}
          extract-bbox: ${{ matrix.extract_bbox }}
          west: ${{ matrix.west }}
          south: ${{ matrix.south }}
          east: ${{ matrix.east }}
          north: ${{ matrix.north }}
          asset-name: ${{ matrix.asset_name }}
          metadata-name: ${{ matrix.metadata_name }}
          release-tag: ${{ env.WORLD_RELEASE_TAG }}

  build-bucket-3:
    needs: plan-world
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-world.outputs.bucket3) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-pmtiles-shard
        with:
          id: ${{ matrix.id }}
          slug: ${{ matrix.slug }}
          name: ${{ matrix.name }}
          continent: ${{ matrix.continent }}
          pbf-url: ${{ matrix.pbf_url }}
          extract-bbox: ${{ matrix.extract_bbox }}
          west: ${{ matrix.west }}
          south: ${{ matrix.south }}
          east: ${{ matrix.east }}
          north: ${{ matrix.north }}
          asset-name: ${{ matrix.asset_name }}
          metadata-name: ${{ matrix.metadata_name }}
          release-tag: ${{ env.WORLD_RELEASE_TAG }}

  build-bucket-4:
    needs: plan-world
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-world.outputs.bucket4) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-pmtiles-shard
        with:
          id: ${{ matrix.id }}
          slug: ${{ matrix.slug }}
          name: ${{ matrix.name }}
          continent: ${{ matrix.continent }}
          pbf-url: ${{ matrix.pbf_url }}
          extract-bbox: ${{ matrix.extract_bbox }}
          west: ${{ matrix.west }}
          south: ${{ matrix.south }}
          east: ${{ matrix.east }}
          north: ${{ matrix.north }}
          asset-name: ${{ matrix.asset_name }}
          metadata-name: ${{ matrix.metadata_name }}
          release-tag: ${{ env.WORLD_RELEASE_TAG }}

  build-bucket-5:
    needs: plan-world
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-world.outputs.bucket5) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-pmtiles-shard
        with:
          id: ${{ matrix.id }}
          slug: ${{ matrix.slug }}
          name: ${{ matrix.name }}
          continent: ${{ matrix.continent }}
          pbf-url: ${{ matrix.pbf_url }}
          extract-bbox: ${{ matrix.extract_bbox }}
          west: ${{ matrix.west }}
          south: ${{ matrix.south }}
          east: ${{ matrix.east }}
          north: ${{ matrix.north }}
          asset-name: ${{ matrix.asset_name }}
          metadata-name: ${{ matrix.metadata_name }}
          release-tag: ${{ env.WORLD_RELEASE_TAG }}

  publish-world-manifest:
    if: always() && needs.plan-world.result == 'success'
    needs:
      - plan-world
      - build-bucket-0
      - build-bucket-1
      - build-bucket-2
      - build-bucket-3
      - build-bucket-4
      - build-bucket-5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: occumed-canonical-world-plan-${{ github.sha }}
          path: world-plan

      - name: Build manifest from published archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p world-release
          gh release view "$WORLD_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            > world-release/assets.json

          node scripts/build-world-manifest.mjs \
            --plan world-plan/world-plan.json \
            --assets world-release/assets.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$WORLD_RELEASE_TAG" \
            --output world-release/world-virtual-manifest.json

          gh release upload "$WORLD_RELEASE_TAG" \
            world-release/world-virtual-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          cat world-release/world-virtual-manifest.json

      - name: Require zero missing worldwide shards
        run: |
          test -s world-release/world-virtual-manifest.json
          missing="$(node -p "require('./world-release/world-virtual-manifest.json').missingRegionCount")"
          if [ "$missing" -ne 0 ]; then
            echo "$missing worldwide PMTiles shards are still missing from the release." >&2
            exit 1
          fi

      - name: Preserve final worldwide manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occumed-world-manifest-${{ github.sha }}
          path: world-release/world-virtual-manifest.json
          if-no-files-found: error
          retention-days: 30
