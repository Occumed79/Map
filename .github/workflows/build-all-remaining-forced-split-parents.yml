name: Build All Remaining Forced-Split Parents

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

env:
  PMTILES_VERSION: v1.31.2
  CANDIDATE_RELEASE_TAG: occumed-world-replacement-candidates-v1
  MAX_CANDIDATE_BYTES: '1932735283'

jobs:
  prepare-matrix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == 'build/all-remaining-forced-split-candidates')
    runs-on: ubuntu-latest
    outputs:
      families: ${{ steps.matrix.outputs.families }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/replace-forced-split-families

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate quarantine inventory
        run: |
          set -euo pipefail
          npm ci
          node scripts/check-forced-split-quarantine.mjs

      - id: matrix
        name: Queue every unfinished family
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config/forced-split-families.json', 'utf8'));
          const completed = new Set(['sul', 'nordeste', 'southern-zone']);
          const families = config.families.map((entry) => entry.id).filter((id) => !completed.has(id)).sort();
          if (families.length !== 48) throw new Error(`Expected 48 unfinished families, found ${families.length}.`);
          console.log(`families=${JSON.stringify(families)}`);
          console.log(`count=${families.length}`);
          NODE

      - name: Write matrix summary
        run: echo "Queued ${{ steps.matrix.outputs.count }} unfinished forced-split families." >> "$GITHUB_STEP_SUMMARY"

  rebuild-parent:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        family: ${{ fromJSON(needs.prepare-matrix.outputs.families) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/replace-forced-split-families

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install dependencies and authorize family
        run: |
          set -euo pipefail
          npm ci
          node scripts/check-forced-split-quarantine.mjs
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config/forced-split-families.json', 'utf8'));
          const family = process.env.FAMILY;
          if (!config.families.some((entry) => entry.id === family)) throw new Error(`${family} is not quarantined.`);
          if (['sul', 'nordeste', 'southern-zone'].includes(family)) throw new Error(`${family} already completed.`);
          NODE

      - name: Resolve original unsplit source
        run: |
          set -euo pipefail
          mkdir -p replacement .planetiler-data
          OCCUMED_WORLD_SIZE_AWARE=0 node scripts/plan-world-shards.mjs --scope all > replacement/unsplit-world-plan.json
          node scripts/select-unsplit-replacement-source.mjs "$FAMILY" replacement/unsplit-world-plan.json replacement/source.json
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('replacement/source.json', 'utf8'));
          console.log(`SOURCE_ID=${source.id}`);
          console.log(`SOURCE_PBF_URL=${source.pbf_url}`);
          NODE

      - name: Download and hash unsplit parent PBF
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --output .planetiler-data/source.osm.pbf "$SOURCE_PBF_URL"
          test -s .planetiler-data/source.osm.pbf
          sha256sum .planetiler-data/source.osm.pbf | tee replacement/source.osm.pbf.sha256

      - name: Build coherent raw detail PMTiles
        run: |
          set -euo pipefail
          mkdir -p replacement/output
          OCCUMED_TILE_AREA="$SOURCE_ID" \
          OCCUMED_OSM_PBF="$PWD/.planetiler-data/source.osm.pbf" \
          OCCUMED_PMTILES_OUTPUT="$PWD/replacement/output/occumed-replacement-${FAMILY}.pmtiles" \
          OCCUMED_PLANETILER_DATA_DIR="$PWD/.planetiler-data" \
          OCCUMED_PLANETILER_MEMORY=6g \
            bash planetiler/build-region.sh

      - name: Verify and classify candidate
        run: |
          set -euo pipefail
          PMTILES_BIN="$(go env GOPATH)/bin/go-pmtiles"
          go install "github.com/protomaps/go-pmtiles@${PMTILES_VERSION}"
          FILE="replacement/output/occumed-replacement-${FAMILY}.pmtiles"
          test -s "$FILE"
          test "$(head -c 7 "$FILE")" = PMTiles
          "$PMTILES_BIN" show "$FILE" | tee "replacement/output/occumed-replacement-${FAMILY}.metadata.txt"
          sha256sum "$FILE" | tee "${FILE}.sha256"
          BYTES="$(stat -c %s "$FILE")"
          if [ "$BYTES" -lt "$MAX_CANDIDATE_BYTES" ]; then
            echo 'CANDIDATE_UPLOADABLE=true' >> "$GITHUB_ENV"
            STATUS='raw-detail-candidate-awaiting-offline-owner-compilation'
          else
            echo 'CANDIDATE_UPLOADABLE=false' >> "$GITHUB_ENV"
            STATUS='oversized-requires-exclusive-owner-partitions'
          fi
          STATUS="$STATUS" BYTES="$BYTES" node - <<'NODE'
          const fs = require('fs');
          const family = process.env.FAMILY;
          const source = JSON.parse(fs.readFileSync('replacement/source.json', 'utf8'));
          fs.writeFileSync(`replacement/output/occumed-replacement-${family}.report.json`, JSON.stringify({
            generatedAt: new Date().toISOString(), family, sourceId: source.id, sourcePbfUrl: source.pbf_url,
            bytes: Number(process.env.BYTES), active: false, status: process.env.STATUS,
            runtimeMerge: false, syntheticLandcover: false
          }, null, 2) + '\n');
          NODE

      - name: Upload eligible raw candidate to isolated release
        if: env.CANDIDATE_UPLOADABLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$CANDIDATE_RELEASE_TAG" >/dev/null
          gh release upload "$CANDIDATE_RELEASE_TAG" \
            "replacement/output/occumed-replacement-${FAMILY}.pmtiles" \
            "replacement/output/occumed-replacement-${FAMILY}.pmtiles.sha256" \
            "replacement/output/occumed-replacement-${FAMILY}.metadata.txt" \
            "replacement/output/occumed-replacement-${FAMILY}.report.json" --clobber

      - name: Preserve build classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replacement-${{ matrix.family }}-matrix-report
          path: |
            replacement/source.json
            replacement/source.osm.pbf.sha256
            replacement/output/*.sha256
            replacement/output/*.metadata.txt
            replacement/output/*.report.json
          if-no-files-found: warn
          retention-days: 30
