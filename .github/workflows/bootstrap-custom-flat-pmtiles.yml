name: Patch Custom Flat Antimeridian

on:
  push:
    branches:
      - build/custom-flat-from-globe-tiles

permissions:
  contents: write

concurrency:
  group: patch-custom-flat-antimeridian
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/custom-flat-from-globe-tiles
          fetch-depth: 0

      - name: Check whether adaptive flat wrapping is already installed
        id: guard
        run: |
          if grep -q 'installAdaptiveFlatWorldWrap(map);' src/occumed-map.js; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Adaptive flat wrapping is already installed."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable antimeridian wrapping only above world zoom
        if: steps.guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          map_path = Path('src/occumed-map.js')
          source = map_path.read_text()
          marker = 'function resolvePublicOrigin(style, styleUrl) {'
          addition = '''export function installAdaptiveFlatWorldWrap(map) {
            const sync = () => {
              if (typeof map.setRenderWorldCopies !== 'function') return;
              map.setRenderWorldCopies(map.getZoom() >= 3);
            };
            map.on('zoom', sync);
            map.on('zoomend', sync);
            map.once('remove', () => {
              map.off('zoom', sync);
              map.off('zoomend', sync);
            });
            sync();
          }

          '''
          if marker not in source:
              raise SystemExit('Could not find flat-wrap insertion point.')
          source = source.replace(marker, addition + marker, 1)
          source = source.replace(
              '  installExactTileAddressing(map);\n',
              '  installExactTileAddressing(map);\n  installAdaptiveFlatWorldWrap(map);\n',
              1,
          )
          map_path.write_text(source)

          validator_path = Path('scripts/validate-immutable-visuals.mjs')
          validator = validator_path.read_text()
          old = '''    const map = globalThis.__OCCUMED_MAP__;
              map.stop();
              map.jumpTo({ center, zoom, bearing: 0, pitch: 0 });'''
          new = '''    const map = globalThis.__OCCUMED_MAP__;
              map.stop();
              if (typeof map.setRenderWorldCopies === 'function') {
                map.setRenderWorldCopies(zoom >= 3);
              }
              map.jumpTo({ center, zoom, bearing: 0, pitch: 0 });'''
          if old not in validator:
              raise SystemExit('Could not find camera-jump validation block.')
          validator_path.write_text(validator.replace(old, new, 1))

          check_path = Path('scripts/check-custom-flat-tiles.mjs')
          check = check_path.read_text()
          needle = "expect(mapSource.includes('installExactTileAddressing(map);'), 'Exact prebuilt tile addressing is not installed.');"
          replacement = needle + "\nexpect(mapSource.includes('installAdaptiveFlatWorldWrap(map);'), 'Adaptive high-zoom antimeridian wrapping is not installed.');"
          if needle not in check:
              raise SystemExit('Could not find custom flat contract insertion point.')
          check_path.write_text(check.replace(needle, replacement, 1))
          PY

      - name: Commit flat antimeridian fix
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/occumed-map.js scripts/validate-immutable-visuals.mjs scripts/check-custom-flat-tiles.mjs
          git commit -m 'Support flat-map antimeridian validation [flat-wrap-fix]'
          git push origin HEAD:build/custom-flat-from-globe-tiles
