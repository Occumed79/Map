name: Snapshot worldwide PMTiles inventory state

on:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - diagnostics/world-repair-macos.trigger

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-planetiler-pmtiles-basemap
          fetch-depth: 0

      - name: Capture inventory and repair workflow states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/inventory-world-release.yml/runs?branch=feat%2Fcustom-planetiler-pmtiles-basemap&event=push&per_page=10" > /tmp/inventory-runs.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/repair-missing-world-pmtiles.yml/runs?branch=feat%2Fcustom-planetiler-pmtiles-basemap&event=push&per_page=10" > /tmp/repair-runs.json

          node <<'NODE'
          const fs = require('node:fs');
          const first = (file) => {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            return (payload.workflow_runs || [])[0] || null;
          };
          const normalize = (run) => run ? {
            id: String(run.id),
            url: run.html_url,
            status: run.status,
            conclusion: run.conclusion,
            createdAt: run.created_at,
            updatedAt: run.updated_at
          } : null;
          const status = {
            capturedAt: new Date().toISOString(),
            inventory: normalize(first('/tmp/inventory-runs.json')),
            missingRepair: normalize(first('/tmp/repair-runs.json'))
          };
          fs.writeFileSync('diagnostics/world-inventory-repair-state.json', `${JSON.stringify(status, null, 2)}\n`);
          console.log(JSON.stringify(status, null, 2));
          NODE

      - name: Commit workflow state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/world-inventory-repair-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot worldwide PMTiles inventory state"
          git pull --rebase origin feat/custom-planetiler-pmtiles-basemap
          git push origin HEAD:feat/custom-planetiler-pmtiles-basemap
