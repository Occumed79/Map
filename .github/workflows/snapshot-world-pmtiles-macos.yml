name: Snapshot worldwide PMTiles progress (macOS)

on:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - diagnostics/world-repair-macos.trigger

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-planetiler-pmtiles-basemap
          fetch-depth: 0

      - name: Count every worldwide shard job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/repair-world-pmtiles.yml/runs?branch=feat%2Fcustom-planetiler-pmtiles-basemap&event=push&per_page=10" \
            > /tmp/repair-runs.json

          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/repair-runs.json', 'utf8'));
          const run = (payload.workflow_runs || [])[0];
          if (!run) throw new Error('No worldwide repair run found.');
          fs.writeFileSync('/tmp/run.json', JSON.stringify(run));
          fs.writeFileSync('/tmp/run-id.txt', String(run.id));
          NODE

          RUN_ID="$(cat /tmp/run-id.txt)"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > /tmp/job-pages.json

          node <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('/tmp/run.json', 'utf8'));
          const pages = JSON.parse(fs.readFileSync('/tmp/job-pages.json', 'utf8'));
          const jobs = pages.flatMap((page) => page.jobs || []);
          const shards = jobs.filter((job) => job.name.startsWith('build-bucket-'));
          const count = (predicate) => shards.filter(predicate).length;
          const successful = count((job) => job.conclusion === 'success');
          const failed = count((job) => job.conclusion === 'failure');
          const cancelled = count((job) => job.conclusion === 'cancelled');
          const skipped = count((job) => job.conclusion === 'skipped');
          const inProgress = count((job) => job.status === 'in_progress');
          const queued = count((job) => job.status === 'queued');
          const nonFailedTarget = shards.length - failed;
          const completionPercentageExcludingFailures = nonFailedTarget > 0
            ? Number(((successful / nonFailedTarget) * 100).toFixed(2))
            : 0;
          const failures = shards
            .filter((job) => job.conclusion === 'failure')
            .map((job) => ({ id: job.id, name: job.name }));
          const status = {
            capturedAt: new Date().toISOString(),
            runId: String(run.id),
            runUrl: run.html_url,
            runStatus: run.status,
            runConclusion: run.conclusion,
            totalShardJobs: shards.length,
            successfulShardJobs: successful,
            failedShardJobs: failed,
            cancelledShardJobs: cancelled,
            skippedShardJobs: skipped,
            inProgressShardJobs: inProgress,
            queuedShardJobs: queued,
            nonFailedTarget,
            completionPercentageExcludingFailures,
            failures
          };
          fs.writeFileSync(
            'diagnostics/world-repair-live-percentage.json',
            `${JSON.stringify(status, null, 2)}\n`
          );
          console.log(JSON.stringify(status, null, 2));
          NODE

      - name: Commit live percentage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/world-repair-live-percentage.json
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot worldwide PMTiles completion percentage"
          git pull --rebase origin feat/custom-planetiler-pmtiles-basemap
          git push origin HEAD:feat/custom-planetiler-pmtiles-basemap
