name: Snapshot worldwide PMTiles release coverage (macOS)

on:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - diagnostics/world-repair-macos.trigger

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-planetiler-pmtiles-basemap
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compare canonical plan with every paginated release asset
        env:
          GH_TOKEN: ${{ github.token }}
          WORLD_RELEASE_TAG: occumed-world-v1
        run: |
          mkdir -p diagnostics /tmp/world-coverage
          node scripts/plan-world-shards.mjs --scope all > /tmp/world-coverage/raw-plan.json

          node <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync('/tmp/world-coverage/raw-plan.json', 'utf8'));
          const excluded = new Set([
            'alps', 'britain-and-ireland', 'dach', 'great-britain', 'sea',
            'south-africa-and-lesotho', 'us', 'us-midwest', 'us-northeast',
            'us-pacific', 'us-south', 'us-west'
          ]);
          const include = input.include.filter((region) =>
            !excluded.has(region.id) && !excluded.has(region.source_region_id)
          );
          fs.writeFileSync(
            '/tmp/world-coverage/world-plan.json',
            `${JSON.stringify({ ...input, canonical: true, include }, null, 2)}\n`
          );
          NODE

          release_id="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${WORLD_RELEASE_TAG}" --jq '.id')"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > /tmp/world-coverage/asset-pages.json

          node <<'NODE'
          const fs = require('node:fs');
          const pages = JSON.parse(fs.readFileSync('/tmp/world-coverage/asset-pages.json', 'utf8'));
          const assets = pages.flatMap((page) => page || []);
          fs.writeFileSync(
            '/tmp/world-coverage/assets.json',
            `${JSON.stringify({ assets }, null, 2)}\n`
          );
          NODE

          node scripts/build-world-manifest.mjs \
            --plan /tmp/world-coverage/world-plan.json \
            --assets /tmp/world-coverage/assets.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$WORLD_RELEASE_TAG" \
            --output diagnostics/world-release-coverage.json

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('diagnostics/world-release-coverage.json', 'utf8'));
          const assetsPayload = JSON.parse(fs.readFileSync('/tmp/world-coverage/assets.json', 'utf8'));
          manifest.releaseAssetCount = assetsPayload.assets.length;
          manifest.capturedAt = new Date().toISOString();
          fs.writeFileSync(
            'diagnostics/world-release-coverage.json',
            `${JSON.stringify(manifest, null, 2)}\n`
          );
          console.log(JSON.stringify({
            planned: manifest.plannedRegionCount,
            available: manifest.availableRegionCount,
            missing: manifest.missingRegionCount,
            releaseAssets: manifest.releaseAssetCount,
            missingRegions: manifest.missingRegions
          }, null, 2));
          NODE

      - name: Commit release coverage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/world-release-coverage.json
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot worldwide PMTiles release coverage"
          git pull --rebase origin feat/custom-planetiler-pmtiles-basemap
          git push origin HEAD:feat/custom-planetiler-pmtiles-basemap
