name: Snapshot worldwide PMTiles cleanup state

on:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - diagnostics/world-repair-macos.trigger

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-planetiler-pmtiles-basemap
          fetch-depth: 0

      - name: Capture cleanup workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/clean-world-release.yml/runs?branch=feat%2Fcustom-planetiler-pmtiles-basemap&event=push&per_page=10" > /tmp/cleanup-runs.json

          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/cleanup-runs.json', 'utf8'));
          const run = (payload.workflow_runs || [])[0] || null;
          const status = {
            capturedAt: new Date().toISOString(),
            cleanup: run ? {
              id: String(run.id),
              url: run.html_url,
              status: run.status,
              conclusion: run.conclusion,
              createdAt: run.created_at,
              updatedAt: run.updated_at
            } : null
          };
          fs.writeFileSync('diagnostics/world-release-cleanup-status.json', `${JSON.stringify(status, null, 2)}\n`);
          console.log(JSON.stringify(status, null, 2));
          NODE

      - name: Commit cleanup workflow state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/world-release-cleanup-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot worldwide PMTiles cleanup state"
          git pull --rebase origin feat/custom-planetiler-pmtiles-basemap
          git push origin HEAD:feat/custom-planetiler-pmtiles-basemap
