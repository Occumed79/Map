name: Finalize Neon navigation cache

on:
  push:
    branches:
      - fix/neon-navigation-cache

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/neon-navigation-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Parse changed runtime files
        run: |
          node --check server.mjs
          node --check src/server/world-tile-gateway.js
          node --check src/server/neon-navigation-tile-cache.js
          node --check scripts/check-neon-navigation-cache.mjs
      - name: Run focused Neon cache guard
        run: npm run check:neon-cache
      - name: Commit generated lockfile and remove temporary scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/finalize-neon-cache.yml tmp-neon-branch-anchor.txt
          git commit -m "Finalize Neon navigation cache integration"
          git push origin HEAD:fix/neon-navigation-cache
