name: Build Fresno Occu-Med PMTiles

on:
  workflow_dispatch:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - planetiler/**
      - scripts/capture-pmtiles-preview.mjs
      - scripts/check-server-health.mjs
      - server.mjs
      - src/**
      - package.json
      - .github/workflows/build-fresno-pmtiles.yml
  pull_request:
    paths:
      - planetiler/**
      - scripts/capture-pmtiles-preview.mjs
      - scripts/check-server-health.mjs
      - server.mjs
      - src/**
      - package.json
      - .github/workflows/build-fresno-pmtiles.yml

permissions:
  contents: read

jobs:
  build-fresno-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show runner capacity
        run: |
          free -h
          df -h
          docker --version

      - name: Install OSM extract tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool

      - name: Download California OpenStreetMap extract
        run: |
          mkdir -p .planetiler-data artifacts
          curl --fail --location --retry 4 --retry-delay 5 \
            --output .planetiler-data/california-latest.osm.pbf \
            https://download.geofabrik.de/north-america/us/california-latest.osm.pbf
          ls -lh .planetiler-data/california-latest.osm.pbf

      - name: Extract Fresno and central Sierra region
        run: |
          osmium extract \
            --bbox=-120.55,35.50,-118.45,37.55 \
            --strategy=complete_ways \
            --overwrite \
            --output=.planetiler-data/fresno.osm.pbf \
            .planetiler-data/california-latest.osm.pbf
          rm .planetiler-data/california-latest.osm.pbf
          osmium fileinfo -e .planetiler-data/fresno.osm.pbf
          ls -lh .planetiler-data/fresno.osm.pbf
          df -h

      - name: Build custom Fresno PMTiles archive
        env:
          OCCUMED_TILE_AREA: fresno
          OCCUMED_OSM_PBF: ${{ github.workspace }}/.planetiler-data/fresno.osm.pbf
          OCCUMED_PMTILES_OUTPUT: ${{ github.workspace }}/artifacts/occumed-fresno.pmtiles
          OCCUMED_PLANETILER_DATA_DIR: ${{ github.workspace }}/.planetiler-data
          OCCUMED_PLANETILER_MEMORY: 4g
        run: bash planetiler/build-region.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install map and browser dependencies
        run: |
          npm install
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build production map with the custom archive
        env:
          OCCUMED_WORLD_MANIFEST_URL: off
          OCCUMED_PMTILES_URL: __OCCUMED_PUBLIC_ORIGIN__/tiles/occumed-fresno.pmtiles
        run: |
          mkdir -p public/tiles artifacts/visual-preview
          cp artifacts/occumed-fresno.pmtiles public/tiles/occumed-fresno.pmtiles
          npm run build
          test -s dist/tiles/occumed-fresno.pmtiles
          ls -lh dist/tiles/occumed-fresno.pmtiles

      - name: Verify range serving and capture real map views
        run: |
          PORT=4173 HOST=127.0.0.1 npm start > artifacts/preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/health

          curl --silent --show-error --fail \
            --header 'Range: bytes=0-126' \
            --dump-header artifacts/pmtiles-range.headers.txt \
            --output artifacts/pmtiles-header.bin \
            http://127.0.0.1:4173/tiles/occumed-fresno.pmtiles
          grep -Eiq '^HTTP/.* 206' artifacts/pmtiles-range.headers.txt
          grep -Eiq '^accept-ranges: bytes' artifacts/pmtiles-range.headers.txt
          test "$(wc -c < artifacts/pmtiles-header.bin)" -eq 127

          node scripts/capture-pmtiles-preview.mjs
          cat artifacts/visual-preview/preview-report.json

      - name: Write archive manifest
        run: |
          (
            cd artifacts
            sha256sum occumed-fresno.pmtiles > occumed-fresno.pmtiles.sha256
          )
          {
            echo "commit=${GITHUB_SHA}"
            echo "source=https://download.geofabrik.de/north-america/us/california-latest.osm.pbf"
            echo "bounds=-120.55,35.50,-118.45,37.55"
            echo "profile=planetiler/occumed-basemap.yml"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            stat --printf='size_bytes=%s\n' artifacts/occumed-fresno.pmtiles
            cat artifacts/occumed-fresno.pmtiles.sha256
          } | tee artifacts/occumed-fresno.manifest.txt

      - name: Upload Fresno archive and rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: occumed-fresno-pmtiles-${{ github.sha }}
          path: |
            artifacts/occumed-fresno.pmtiles
            artifacts/occumed-fresno.pmtiles.sha256
            artifacts/occumed-fresno.manifest.txt
            artifacts/pmtiles-range.headers.txt
            artifacts/preview-server.log
            artifacts/visual-preview/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
