name: Validate literal Occu-Med Mapbox style

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify untouched uploaded export
        run: npm run validate:export

      - name: Copy style byte-for-byte
        run: npm run prepare:style

      - name: Confirm build copy is identical
        run: cmp style.json public/style.json

      - name: Build self-hosted Mapbox viewer
        run: npx vite build
