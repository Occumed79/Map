name: Validate Occu-Med open basemap

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify untouched Mapbox export
        run: npm run check:export

      - name: Compile uploaded SVG sprites
        run: npm run prepare:sprites

      - name: Convert exact style to open data
        run: npm run prepare:style

      - name: Validate reusable basemap
        run: npm run check:runtime

      - name: Build MapLibre viewer
        run: npx vite build

      - name: Summarize generated compatibility report
        run: |
          node -e "const r=require('./public/style/compatibility-report.json'); console.log({original:r.originalLayerCount,runtime:r.runtimeLayerCount,skipped:r.skippedLayerCount,mappings:r.sourceLayerMappings})"

  style-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Quiet MapLibre style validation
        shell: bash
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          npm install --silent
          npm run prepare:assets >/dev/null
          node -e "const s=require('./public/style/occumed-open.json'); for (const i of [120,121]) console.log(i, s.layers[i].id, JSON.stringify(s.layers[i].filter))"
          node scripts/validate-maplibre-style.mjs
