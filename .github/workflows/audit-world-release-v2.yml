name: Audit Published Worldwide Occu-Med PMTiles v2

on:
  workflow_dispatch:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - diagnostics/world-release-audit-v2.trigger

permissions:
  contents: write

concurrency:
  group: occumed-world-pmtiles-missing-repair
  cancel-in-progress: true

env:
  WORLD_RELEASE_TAG: occumed-world-v1
  OCCUMED_DIRECT_PBF_LIMIT_BYTES: 400000000
  OCCUMED_TARGET_SPLIT_PBF_BYTES: 250000000
  OCCUMED_MAX_SPLIT_CELLS: 24

jobs:
  audit-release:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-planetiler-pmtiles-basemap
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit canonical publication state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf world-release-audit-v2
          mkdir -p world-release-audit-v2

          node scripts/plan-world-shards.mjs --scope all > world-release-audit-v2/raw-world-plan.json
          release_id="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${WORLD_RELEASE_TAG}" --jq '.id')"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > world-release-audit-v2/release-asset-pages.json

          node <<'NODE'
          const fs = require('node:fs');

          const input = JSON.parse(fs.readFileSync('world-release-audit-v2/raw-world-plan.json', 'utf8'));
          const pages = JSON.parse(fs.readFileSync('world-release-audit-v2/release-asset-pages.json', 'utf8'));
          const releaseAssets = pages.flatMap((page) => page || []);
          const excluded = new Set([
            'alps', 'britain-and-ireland', 'dach', 'great-britain', 'sea',
            'south-africa-and-lesotho', 'us', 'us-midwest', 'us-northeast',
            'us-pacific', 'us-south', 'us-west'
          ]);
          const include = input.include.filter((region) =>
            !excluded.has(region.id) && !excluded.has(region.source_region_id)
          );
          const ids = include.map((region) => region.id);
          const assetNames = include.map((region) => region.asset_name);
          if (!include.length) throw new Error('Canonical worldwide plan is empty.');
          if (new Set(ids).size !== ids.length) throw new Error('Canonical plan contains duplicate IDs.');
          if (new Set(assetNames).size !== assetNames.length) throw new Error('Canonical plan contains duplicate asset names.');
          if (include.some((region) => region.source_size_bytes > 400000000 && !region.extract_bbox)) {
            throw new Error('An oversized source remains unsplit.');
          }

          const plan = {
            ...input,
            generatedAt: new Date().toISOString(),
            canonical: true,
            excludedSourceRegions: [...excluded],
            include
          };
          const byName = new Map(releaseAssets.map((asset) => [asset.name, asset]));
          const present = include.filter((region) => byName.has(region.asset_name));
          const missing = include.filter((region) => !byName.has(region.asset_name));
          const releaseBase = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.WORLD_RELEASE_TAG}`;

          async function verify(region) {
            const asset = byName.get(region.asset_name);
            if (!asset || Number(asset.size) <= 0) {
              return {
                regionId: region.id,
                assetName: region.asset_name,
                apiSizeBytes: Number(asset?.size || 0),
                healthy: false,
                reason: asset ? 'zero_size_asset' : 'missing_asset',
                httpStatus: null,
                returnedBytes: 0,
                magic: ''
              };
            }
            let last = null;
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              try {
                const response = await fetch(`${releaseBase}/${encodeURIComponent(region.asset_name)}`, {
                  redirect: 'follow',
                  headers: { Range: 'bytes=0-126' }
                });
                const bytes = new Uint8Array(await response.arrayBuffer());
                const magic = new TextDecoder().decode(bytes.slice(0, 7));
                const healthy = response.status === 206 && bytes.length === 127 && magic === 'PMTiles';
                last = {
                  regionId: region.id,
                  assetName: region.asset_name,
                  apiSizeBytes: Number(asset.size),
                  healthy,
                  reason: healthy
                    ? 'ok'
                    : response.status !== 206
                      ? 'range_not_supported'
                      : bytes.length !== 127
                        ? 'wrong_range_length'
                        : 'invalid_pmtiles_magic',
                  httpStatus: response.status,
                  returnedBytes: bytes.length,
                  magic
                };
                if (healthy) return last;
              } catch (error) {
                last = {
                  regionId: region.id,
                  assetName: region.asset_name,
                  apiSizeBytes: Number(asset.size),
                  healthy: false,
                  reason: 'download_failed',
                  httpStatus: null,
                  returnedBytes: 0,
                  magic: '',
                  error: String(error?.message || error)
                };
              }
              await new Promise((resolve) => setTimeout(resolve, attempt * 1500));
            }
            return last;
          }

          async function mapConcurrent(items, concurrency, fn) {
            const results = new Array(items.length);
            let next = 0;
            async function worker() {
              while (true) {
                const index = next++;
                if (index >= items.length) return;
                results[index] = await fn(items[index]);
              }
            }
            await Promise.all(Array.from({ length: Math.min(concurrency, items.length || 1) }, worker));
            return results;
          }

          const verification = await mapConcurrent(present, 12, verify);
          const healthyIds = new Set(verification.filter((item) => item.healthy).map((item) => item.regionId));
          const invalid = verification.filter((item) => !item.healthy);
          const missingIds = new Set(missing.map((region) => region.id));
          const repairTargets = include.filter((region) => missingIds.has(region.id) || !healthyIds.has(region.id));
          const canonicalAssetNames = new Set(include.map((region) => region.asset_name));
          const extraPmtilesAssets = releaseAssets
            .filter((asset) => asset.name.endsWith('.pmtiles') && !canonicalAssetNames.has(asset.name))
            .map((asset) => ({ id: asset.id, name: asset.name, size: asset.size, updatedAt: asset.updated_at }));

          const summary = {
            capturedAt: new Date().toISOString(),
            releaseTag: process.env.WORLD_RELEASE_TAG,
            canonicalShardCount: include.length,
            totalReleaseAssetCount: releaseAssets.length,
            publishedCanonicalAssetCount: present.length,
            healthyPublishedCanonicalCount: verification.length - invalid.length,
            invalidPublishedCanonicalCount: invalid.length,
            missingCanonicalCount: missing.length,
            repairTargetCount: repairTargets.length,
            extraPmtilesAssetCount: extraPmtilesAssets.length,
            invalidPublishedAssets: invalid,
            missingRegions: missing.map((region) => ({ id: region.id, asset: region.asset_name })),
            extraPmtilesAssets
          };

          fs.writeFileSync(
            'world-release-audit-v2/canonical-world-plan.json',
            `${JSON.stringify(plan, null, 2)}\n`
          );
          fs.writeFileSync(
            'world-release-audit-v2/published-state-summary.json',
            `${JSON.stringify(summary, null, 2)}\n`
          );
          fs.writeFileSync(
            'world-release-audit-v2/repair-targets.json',
            `${JSON.stringify({ ...plan, include: repairTargets }, null, 2)}\n`
          );
          fs.writeFileSync(
            'world-release-audit-v2/verification.json',
            `${JSON.stringify(verification, null, 2)}\n`
          );

          console.log(JSON.stringify({
            canonical: summary.canonicalShardCount,
            releaseAssets: summary.totalReleaseAssetCount,
            publishedByName: summary.publishedCanonicalAssetCount,
            healthy: summary.healthyPublishedCanonicalCount,
            invalid: summary.invalidPublishedCanonicalCount,
            missing: summary.missingCanonicalCount,
            repairTargets: summary.repairTargetCount,
            extraPmtilesAssets: summary.extraPmtilesAssetCount
          }, null, 2));
          NODE

      - name: Commit published-state assessment
        run: |
          set -euo pipefail
          rm -rf diagnostics/world-release-audit
          mkdir -p diagnostics/world-release-audit
          cp world-release-audit-v2/published-state-summary.json diagnostics/world-release-audit/published-state-summary.json
          cp world-release-audit-v2/repair-targets.json diagnostics/world-release-audit/repair-targets.json
          cp world-release-audit-v2/canonical-world-plan.json diagnostics/world-release-audit/canonical-world-plan.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/world-release-audit
          git diff --cached --quiet && exit 0
          git commit -m "Audit published worldwide PMTiles release state"
          git pull --rebase origin feat/custom-planetiler-pmtiles-basemap
          git push origin HEAD:feat/custom-planetiler-pmtiles-basemap

      - name: Preserve complete release audit
        uses: actions/upload-artifact@v4
        with:
          name: occumed-world-release-audit-v2-${{ github.sha }}
          path: world-release-audit-v2
          if-no-files-found: error
          retention-days: 30
