name: Audit Forced Grid-Split Regions

on:
  push:
    branches:
      - audit/identify-forced-split-regions
    paths-ignore:
      - audit/forced-split-regions.json
      - audit/forced-split-regions.md
      - audit/world-plan.json
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/identify-forced-split-regions

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate current size-aware world plan
        run: |
          mkdir -p audit
          node scripts/plan-world-shards.mjs --scope all > audit/world-plan.json

      - name: Identify forced grid-split families
        run: |
          node scripts/report-forced-split-regions.mjs \
            audit/world-plan.json \
            audit/forced-split-regions.json \
            audit/forced-split-regions.md
          cat audit/forced-split-regions.md

      - name: Commit audit results
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/world-plan.json audit/forced-split-regions.json audit/forced-split-regions.md
          if git diff --cached --quiet; then
            echo "Audit results unchanged."
          else
            git commit -m "Record forced split region audit"
            git push origin HEAD:audit/identify-forced-split-regions
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: forced-split-region-audit
          path: |
            audit/forced-split-regions.json
            audit/forced-split-regions.md
            audit/world-plan.json
          retention-days: 30
