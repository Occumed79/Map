name: Build Northwestern Federal District Split Shards Concurrently

on:
  workflow_dispatch:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - planetiler/world-missing-repair.trigger

permissions:
  contents: write

concurrency:
  group: occumed-world-pmtiles-northwestern-split
  cancel-in-progress: true

env:
  WORLD_RELEASE_TAG: occumed-world-v1

jobs:
  build-child:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - id: northwestern-fed-district--r1-c1--s2-r1-c1
            name: Northwestern Federal District 1.1 split 1.1
            bbox: 19.40837,54.31282,26.060425,61.371018
            west: 19.40837
            south: 54.31282
            east: 26.060425
            north: 61.371018
          - id: northwestern-fed-district--r1-c1--s2-r1-c2
            name: Northwestern Federal District 1.1 split 1.2
            bbox: 26.060425,54.31282,32.71248,61.371018
            west: 26.060425
            south: 54.31282
            east: 32.71248
            north: 61.371018
          - id: northwestern-fed-district--r1-c1--s2-r1-c3
            name: Northwestern Federal District 1.1 split 1.3
            bbox: 32.71248,54.31282,39.364535,61.371018
            west: 32.71248
            south: 54.31282
            east: 39.364535
            north: 61.371018
          - id: northwestern-fed-district--r1-c1--s2-r1-c4
            name: Northwestern Federal District 1.1 split 1.4
            bbox: 39.364535,54.31282,46.01659,61.371018
            west: 39.364535
            south: 54.31282
            east: 46.01659
            north: 61.371018
          - id: northwestern-fed-district--r1-c1--s2-r2-c1
            name: Northwestern Federal District 1.1 split 2.1
            bbox: 19.40837,61.371018,26.060425,68.429215
            west: 19.40837
            south: 61.371018
            east: 26.060425
            north: 68.429215
          - id: northwestern-fed-district--r1-c1--s2-r2-c2
            name: Northwestern Federal District 1.1 split 2.2
            bbox: 26.060425,61.371018,32.71248,68.429215
            west: 26.060425
            south: 61.371018
            east: 32.71248
            north: 68.429215
          - id: northwestern-fed-district--r1-c1--s2-r2-c3
            name: Northwestern Federal District 1.1 split 2.3
            bbox: 32.71248,61.371018,39.364535,68.429215
            west: 32.71248
            south: 61.371018
            east: 39.364535
            north: 68.429215
          - id: northwestern-fed-district--r1-c1--s2-r2-c4
            name: Northwestern Federal District 1.1 split 2.4
            bbox: 39.364535,61.371018,46.01659,68.429215
            west: 39.364535
            south: 61.371018
            east: 46.01659
            north: 68.429215
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-pmtiles-shard-final
        with:
          id: ${{ matrix.id }}
          slug: ${{ matrix.id }}
          name: ${{ matrix.name }}
          continent: northwestern-fed-district
          pbf-url: https://download.geofabrik.de/russia/northwestern-fed-district-latest.osm.pbf
          extract-bbox: ${{ matrix.bbox }}
          west: ${{ matrix.west }}
          south: ${{ matrix.south }}
          east: ${{ matrix.east }}
          north: ${{ matrix.north }}
          asset-name: occumed-${{ matrix.id }}.pmtiles
          release-tag: ${{ env.WORLD_RELEASE_TAG }}
