name: Capture Enfield PMTiles Failure

on:
  workflow_dispatch:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - planetiler/world-missing-repair.trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: occumed-world-pmtiles-log-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-planetiler-pmtiles-basemap
      - name: Download latest failed Enfield job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          runs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/repair-missing-world-pmtiles.yml/runs?branch=feat%2Fcustom-planetiler-pmtiles-basemap&status=completed&per_page=100")"
          failed_run_id="$(printf '%s' "$runs_json" | jq -r --arg current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.conclusion == "failure" and (.id|tostring) != $current) | .id' | head -n1)"
          if [ -z "$failed_run_id" ] || [ "$failed_run_id" = "null" ]; then
            echo "No prior failed run found" >&2
            exit 1
          fi
          jobs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${failed_run_id}/jobs?per_page=100")"
          job_id="$(printf '%s' "$jobs_json" | jq -r '.jobs[] | select(.name == "enfield") | .id' | head -n1)"
          if [ -z "$job_id" ] || [ "$job_id" = "null" ]; then
            echo "No Enfield job found in failed run ${failed_run_id}" >&2
            exit 1
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > diagnostics/enfield-failure-latest.log
          printf 'run_id=%s\njob_id=%s\n' "$failed_run_id" "$job_id" > diagnostics/enfield-failure-latest.meta
          tail -n 120 diagnostics/enfield-failure-latest.log
      - name: Commit captured failure log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/enfield-failure-latest.log diagnostics/enfield-failure-latest.meta
          git commit -m "Capture exact Enfield PMTiles failure" || exit 0
          git push origin HEAD:feat/custom-planetiler-pmtiles-basemap
