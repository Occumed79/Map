name: Repair Occu-Med Planetiler schema

on:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - .github/workflows/repair-planetiler-schema.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-planetiler-pmtiles-basemap
          fetch-depth: 0

      - name: Apply targeted schema corrections
        run: |
          python3 <<'PY'
          from pathlib import Path

          profile = Path('planetiler/occumed-basemap.yml')
          text = profile.read_text()

          replacements = [
              ('version: "0.2.0"', 'version: "0.3.0"'),
              ('default: \'${ args.area + ".osm.pbf" }\'', 'default: \'${ args.area.replace("/", "_") + ".osm.pbf" }\''),
              ('leisure: [park, garden, playground, golf_course, pitch, nature_reserve]', 'leisure: [garden, playground, golf_course, pitch]'),
              (
                  '        attributes: &transport_name_attributes\n'
                  '          - key: class\n'
                  '            tag_value: highway\n',
                  '        attributes: &transport_name_attributes\n'
                  '          - key: class\n'
                  '            value:\n'
                  '              - if:\n'
                  '                  highway: [unclassified, residential, living_street]\n'
                  '                value: minor\n'
                  '              - else:\n'
                  '                  tag_value: highway\n'
              ),
              (
                  '          place: region\n'
                  '        attributes:\n'
                  '          - key: class\n'
                  '            tag_value: place\n'
                  '          - key: name\n'
                  '            tag_value: name\n'
                  '          - key: population\n',
                  '          place: region\n'
                  '        attributes:\n'
                  '          - key: class\n'
                  '            tag_value: place\n'
                  '          - key: name\n'
                  '            tag_value: name\n'
                  '          - key: name:latin\n'
                  '            value:\n'
                  '              coalesce:\n'
                  '                - tag_value: name:en\n'
                  '                - tag_value: name\n'
                  '          - key: population\n'
              ),
              (
                  '          place: town\n'
                  '        attributes:\n'
                  '          - key: class\n'
                  '            tag_value: place\n'
                  '          - key: name\n'
                  '            tag_value: name\n'
                  '          - key: population\n',
                  '          place: town\n'
                  '        attributes:\n'
                  '          - key: class\n'
                  '            tag_value: place\n'
                  '          - key: name\n'
                  '            tag_value: name\n'
                  '          - key: name:latin\n'
                  '            value:\n'
                  '              coalesce:\n'
                  '                - tag_value: name:en\n'
                  '                - tag_value: name\n'
                  '          - key: population\n'
              ),
              (
                  '          place: village\n'
                  '        attributes:\n'
                  '          - key: class\n'
                  '            tag_value: place\n'
                  '          - key: name\n'
                  '            tag_value: name\n'
                  '          - key: population\n',
                  '          place: village\n'
                  '        attributes:\n'
                  '          - key: class\n'
                  '            tag_value: place\n'
                  '          - key: name\n'
                  '            tag_value: name\n'
                  '          - key: name:latin\n'
                  '            value:\n'
                  '              coalesce:\n'
                  '                - tag_value: name:en\n'
                  '                - tag_value: name\n'
                  '          - key: population\n'
              ),
              (
                  '          place: [suburb, neighbourhood, hamlet]\n'
                  '        attributes:\n'
                  '          - key: class\n'
                  '            tag_value: place\n'
                  '          - key: name\n'
                  '            tag_value: name\n'
                  '          - key: rank\n',
                  '          place: [suburb, neighbourhood, hamlet]\n'
                  '        attributes:\n'
                  '          - key: class\n'
                  '            tag_value: place\n'
                  '          - key: name\n'
                  '            tag_value: name\n'
                  '          - key: name:latin\n'
                  '            value:\n'
                  '              coalesce:\n'
                  '                - tag_value: name:en\n'
                  '                - tag_value: name\n'
                  '          - key: rank\n'
              ),
              (
                  '          - key: name\n'
                  '            tag_value: name\n\n'
                  '  - id: mountain_peak\n',
                  '          - key: name\n'
                  '            tag_value: name\n'
                  '      - source: osm\n'
                  '        geometry: line\n'
                  '        min_zoom: 6\n'
                  '        include_when:\n'
                  '          __all__:\n'
                  '            waterway: [river, canal, stream]\n'
                  '            name: __any__\n'
                  '        attributes:\n'
                  '          - key: class\n'
                  '            tag_value: waterway\n'
                  '          - key: name\n'
                  '            tag_value: name\n\n'
                  '  - id: mountain_peak\n'
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one schema match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          required = [
              'version: "0.3.0"',
              'args.area.replace("/", "_")',
              'leisure: [garden, playground, golf_course, pitch]',
              'highway: [unclassified, residential, living_street]',
              '- id: aerodrome_label',
              'waterway: [river, canal, stream]'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing corrected schema marker: {marker}')
          if text.count('          - key: name:latin') < 7:
              raise SystemExit('All place hierarchy levels do not emit name:latin.')

          profile.write_text(text)
          PY

      - name: Verify corrected Planetiler schema
        run: |
          docker run --rm \
            -v "$PWD/planetiler:/profile:ro" \
            ghcr.io/onthegomap/planetiler:v0.10.2 \
            verify /profile/occumed-basemap.yml

      - name: Commit verified schema and remove one-time workflow
        run: |
          git rm .github/workflows/repair-planetiler-schema.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add planetiler/occumed-basemap.yml
          git commit -m "Correct worldwide Planetiler schema output"
          git push origin HEAD:feat/custom-planetiler-pmtiles-basemap
