name: Canonicalize Occu-Med Planetiler profile

on:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - .github/workflows/canonicalize-planetiler-profile.yml

permissions:
  contents: write

jobs:
  canonicalize-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-planetiler-pmtiles-basemap
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write the corrected generated profile back to source
        run: |
          node scripts/prepare-planetiler-profile.mjs \
            planetiler/occumed-basemap.yml \
            planetiler/occumed-basemap.canonical.yml
          mv planetiler/occumed-basemap.canonical.yml planetiler/occumed-basemap.yml

      - name: Prove the canonical source builds real PMTiles
        run: |
          mkdir -p .planetiler-data artifacts
          curl --fail --location --retry 4 \
            --output .planetiler-data/monaco.osm.pbf \
            https://download.geofabrik.de/europe/monaco-latest.osm.pbf
          OCCUMED_TILE_AREA=monaco \
          OCCUMED_OSM_PBF="$PWD/.planetiler-data/monaco.osm.pbf" \
          OCCUMED_PMTILES_OUTPUT="$PWD/artifacts/occumed-monaco.pmtiles" \
          OCCUMED_PLANETILER_DATA_DIR="$PWD/.planetiler-data" \
          OCCUMED_PLANETILER_MEMORY=3g \
          bash planetiler/build-region.sh
          test -s artifacts/occumed-monaco.pmtiles

      - name: Commit canonical profile and remove temporary diagnostics
        run: |
          git rm .github/workflows/canonicalize-planetiler-profile.yml
          git rm -f diagnostics/planetiler-diagnostic.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add planetiler/occumed-basemap.yml
          git commit -m "Canonicalize the verified Planetiler profile"
          git push origin HEAD:feat/custom-planetiler-pmtiles-basemap
