name: Patch worldwide workflow for size-aware shards

on:
  push:
    branches:
      - feat/custom-planetiler-pmtiles-basemap
    paths:
      - .github/workflows/patch-world-workflow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-planetiler-pmtiles-basemap
          fetch-depth: 0

      - name: Wire the size-aware plan into all six matrices
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-world-pmtiles.yml')
          lines = path.read_text().splitlines(keepends=True)
          output = []
          in_plan_world = False
          timeout_changes = 0
          planner_changes = 0
          matrix_changes = 0
          index = 0

          pbf_line = '          pbf-url: $' + '{{ matrix.pbf_url }}\n'
          extract_line = '          extract-bbox: $' + '{{ matrix.extract_bbox }}\n'
          planner_start = '          node scripts/plan-world-shards.mjs --scope all > world-plan/world-plan.json\n'
          replacement = '''          node scripts/plan-world-shards.mjs --scope all > world-plan/world-plan.json
          for bucket in 0 1 2 3 4 5; do
            jq \\
              --argjson bucket "$bucket" \\
              --argjson buckets "$WORLD_BUCKETS" \\
              '{include: [.include | to_entries[] | select((.key % $buckets) == $bucket) | .value]}' \\
              world-plan/world-plan.json \\
              > "world-plan/bucket-${bucket}.json"
            compact="$(jq -c . "world-plan/bucket-${bucket}.json")"
            echo "bucket${bucket}=${compact}" >> "$GITHUB_OUTPUT"
          done
'''.splitlines(keepends=True)

          while index < len(lines):
            line = lines[index]

            if line == '  plan-world:\n':
              in_plan_world = True
              output.append(line)
              index += 1
              continue
            if in_plan_world and line.startswith('  ') and not line.startswith('    ') and line != '  plan-world:\n':
              in_plan_world = False

            if in_plan_world and line == '    timeout-minutes: 15\n':
              output.append('    timeout-minutes: 30\n')
              timeout_changes += 1
              index += 1
              continue

            if line == planner_start:
              output.extend(replacement)
              planner_changes += 1
              index += 1
              if index >= len(lines) or lines[index] != '          for bucket in 0 1 2 3 4 5; do\n':
                raise SystemExit('Repeated bucket planner loop was not found after planner start.')
              while index < len(lines):
                current = lines[index]
                index += 1
                if current == '          done\n':
                  break
              else:
                raise SystemExit('Repeated bucket planner loop did not terminate.')
              continue

            output.append(line)
            if line == pbf_line:
              output.append(extract_line)
              matrix_changes += 1
            index += 1

          text = ''.join(output)
          if timeout_changes != 1:
            raise SystemExit(f'Expected one plan timeout change, got {timeout_changes}.')
          if planner_changes != 1:
            raise SystemExit(f'Expected one planner-loop change, got {planner_changes}.')
          if matrix_changes != 6:
            raise SystemExit(f'Expected six matrix changes, got {matrix_changes}.')
          if text.count(extract_line) != 6:
            raise SystemExit('Not all six matrices received extract-bbox.')
          if text.count(planner_start) != 1:
            raise SystemExit('Worldwide planner must execute exactly once.')

          path.write_text(text)
          PY

      - name: Validate patched workflow text
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/build-world-pmtiles.yml').read_text()
          extract_line = '          extract-bbox: $' + '{{ matrix.extract_bbox }}\n'
          assert text.count(extract_line) == 6
          assert text.count('node scripts/plan-world-shards.mjs --scope all') == 1
          assert 'timeout-minutes: 30' in text
          PY

      - name: Commit the patch and remove this one-time workflow
        run: |
          git rm .github/workflows/patch-world-workflow.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-world-pmtiles.yml
          git commit -m "Wire size-aware subdivisions into worldwide matrices"
          git push origin HEAD:feat/custom-planetiler-pmtiles-basemap
